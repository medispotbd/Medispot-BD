
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medispot BD | Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f8f6;font-family:Arial,sans-serif;color:#20332b}
header{background:#087b50;color:white;padding:20px}
header h2{margin:0}
main{max-width:850px;margin:22px auto;padding:15px}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 3px 14px #0000000c}
h3{margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #d5e1da;border-radius:9px;font-size:15px}
button{background:#087b50;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e7f3ed;color:#087b50}
button.danger{background:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border-top:1px solid #e4ebe6;padding:14px 0;overflow-wrap:anywhere}
.item img{width:75px;height:75px;object-fit:contain}
.small{font-size:13px;color:#66766d}
#app{display:none}
@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h2>Medispot BD</h2>
<div>Medicine Management • Admin Panel</div>
</header>

<main>
<section class="card" id="login">
<h3>Admin Login</h3>
<p class="small">তোমার Supabase Admin account দিয়ে লগইন করো।</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="loginAdmin()">Login</button>
<p id="loginMsg"></p>
</section>

<section id="app">
<div class="card">
<h3>নতুন ওষুধ যোগ করো</h3>

<form id="medicineForm">
<input id="name" placeholder="ওষুধের নাম *" required>

<div class="grid">
<input id="company" placeholder="কোম্পানির নাম">
<input id="strength" placeholder="Strength (যেমন 10 mg)">
</div>

<div class="grid">
<input id="category" placeholder="Category">
<input id="price" type="number" min="0" step="0.01" placeholder="দাম (৳)" required>
</div>

<div class="grid">
<input
  id="discount"
  type="text"
  inputmode="decimal"
  placeholder="Discount % (যেমন 16.32)"
>
<input id="stock" type="number" min="0" step="1" placeholder="Stock">
</div>

<p class="small">Discount দশমিকসহ দিতে পারবে। উদাহরণ: 16.32%</p>

<label>ওষুধের ছবি</label>
<input id="photo" type="file" accept="image/*">

<button type="submit">ওষুধ Save করো</button>
<button type="button" class="secondary" onclick="resetForm()">ফর্ম পরিষ্কার করো</button>
</form>

<p id="formMsg"></p>
</div>

<div class="card">
<h3>ওষুধের তালিকা</h3>
<input id="search" placeholder="ওষুধের নাম দিয়ে খুঁজুন" oninput="renderMedicines()">
<div id="medicineList">লোড হচ্ছে...</div>
<button class="secondary" onclick="loadMedicines()">তালিকা Refresh</button>
<button class="danger" onclick="logoutAdmin()">Logout</button>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://pnaaqkuzazjiabnnwxjq.supabase.co";
const SUPABASE_KEY = "sb_publishable_ckj65sbFnET7xOjxPJOwfw_-KrevOkv";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let medicines = [];
let editingId = null;

async function loginAdmin(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("loginMsg");

  msg.textContent = "লগইন হচ্ছে...";

  const {error} = await db.auth.signInWithPassword({email,password});

  if(error){
    msg.textContent = "লগইন হয়নি: " + error.message;
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  await loadMedicines();
}

async function logoutAdmin(){
  await db.auth.signOut();
  location.reload();
}

async function loadMedicines(){
  const list = document.getElementById("medicineList");
  list.textContent = "লোড হচ্ছে...";

  const {data,error} = await db
    .from("medicines")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    list.textContent = "তালিকা লোড হয়নি: " + error.message;
    return;
  }

  medicines = data || [];
  renderMedicines();
}

function renderMedicines(){
  const term = (document.getElementById("search").value || "").toLowerCase();
  const list = document.getElementById("medicineList");

  const filtered = medicines.filter(m =>
    String(m.name || "").toLowerCase().includes(term) ||
    String(m.company || "").toLowerCase().includes(term)
  );

  if(!filtered.length){
    list.textContent = "কোনো ওষুধ পাওয়া যায়নি।";
    return;
  }

  list.innerHTML = "";

  filtered.forEach(m=>{
    const div = document.createElement("div");
    div.className = "item";

    if(m.image_url){
      const img = document.createElement("img");
      img.src = m.image_url;
      img.alt = m.name || "Medicine";
      div.appendChild(img);
    }

    const title = document.createElement("strong");
    title.textContent = (m.name || "নাম নেই") + " — ৳" + m.price;
    div.appendChild(title);

    const details = document.createElement("p");
    details.textContent = [
      m.company,
      m.strength,
      "Stock: " + (m.stock ?? 0),
      "Discount: " + (m.discount_percent ?? 0) + "%"
    ].filter(Boolean).join(" • ");

    div.appendChild(details);

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.className = "secondary";
    edit.onclick = () => editMedicine(m.id);
    div.appendChild(edit);

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "danger";
    del.onclick = () => deleteMedicine(m.id);
    div.appendChild(del);

    list.appendChild(div);
  });
}

async function uploadPhoto(file){
  if(!file) return null;

  if(!file.type.startsWith("image/")){
    throw new Error("ছবি ফাইল নির্বাচন করো।");
  }

  if(file.size > 5*1024*1024){
    throw new Error("ছবি 5 MB-এর কম হতে হবে।");
  }

  const ext = (file.name.split(".").pop() || "jpg")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"");

  const path = Date.now() + "-" +
    Math.random().toString(36).slice(2) + "." + ext;

  const {error} = await db.storage
    .from("Medicine-image")
    .upload(path,file,{
      upsert:false,
      contentType:file.type
    });

  if(error) throw error;

  const {data} = db.storage
    .from("Medicine-image")
    .getPublicUrl(path);

  return data.publicUrl;
}

document.getElementById("medicineForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const msg = document.getElementById("formMsg");

  const discountInput = document.getElementById("discount");
  const discountText = discountInput.value.trim();

const discount = discountText === "" ? 0 : Number(discountText.replace(",", ".")););

  if(!Number.isFinite(discount) || discount < 0 || discount > 100){
    msg.textContent = "Discount 0 থেকে 100-এর মধ্যে দাও।";
    return;
  }

  const price = Number(document.getElementById("price").value);

  if(!Number.isFinite(price) || price < 0){
    msg.textContent = "সঠিক দাম দাও।";
    return;
  }

  const {data:{user}} = await db.auth.getUser();

  if(!user){
    msg.textContent = "আগে Admin Login করো।";
    return;
  }

  msg.textContent = "Save হচ্ছে...";

  try{
    const file = document.getElementById("photo").files[0];
    let imageUrl = null;

    if(file){
      imageUrl = await uploadPhoto(file);
    }

    const row = {
      name: document.getElementById("name").value.trim(),
      company: document.getElementById("company").value.trim(),
      strength: document.getElementById("strength").value.trim(),
      category: document.getElementById("category").value.trim(),
      price: price,
      discount_percent: discount,
      stock: Number(document.getElementById("stock").value || 0)
    };

    if(imageUrl){
      row.image_url = imageUrl;
    }

    let result;

    if(editingId){
      result = await db
        .from("medicines")
        .update(row)
        .eq("id",editingId);
    }else{
      result = await db
        .from("medicines")
        .insert(row);
    }

    if(result.error) throw result.error;

    msg.textContent = "সফলভাবে Save হয়েছে!";
    resetForm();
    await loadMedicines();

  }catch(err){
    msg.textContent = "Save হয়নি: " + err.message;
  }
});

function editMedicine(id){
  const m = medicines.find(x => String(x.id) === String(id));
  if(!m) return;

  editingId = id;

  ["name","company","strength","category","price","stock"].forEach(k=>{
    document.getElementById(k).value = m[k] ?? "";
  });

  document.getElementById("discount").value = m.discount_percent ?? 0;
  document.getElementById("photo").value = "";

  document.getElementById("formMsg").textContent =
    "Edit mode: পরিবর্তন করে Save করো। নতুন ছবি না দিলে আগের ছবিই থাকবে।";

  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteMedicine(id){
  if(!confirm("এই ওষুধটি মুছে ফেলতে চাও?")) return;

  const {error} = await db
    .from("medicines")
    .delete()
    .eq("id",id);

  if(error){
    alert("Delete হয়নি: " + error.message);
    return;
  }

  await loadMedicines();
}

function resetForm(){
  editingId = null;
  document.getElementById("medicineForm").reset();
  document.getElementById("formMsg").textContent = "";
}

(async function checkSession(){
  const {data:{session}} = await db.auth.getSession();

  if(session){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    await loadMedicines();
  }
})();
</script>

</body>
</html>
